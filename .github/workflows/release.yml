name: Release binaries

on:
  push:
    tags: ['v*']

jobs:
  build-and-attach:
    name: Build example/server and attach to the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build example/server (linux/amd64, static)
        working-directory: example/server
        env:
          GOWORK: 'off'
          CGO_ENABLED: '0'
          GOOS: 'linux'
          GOARCH: 'amd64'
        run: go build -o smeldr-server-linux-amd64 .

      - name: Confirm the release exists before attaching to it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 10); do
            if gh release view ${{ github.ref_name }} --json tagName >/dev/null 2>&1; then
              echo "Release ${{ github.ref_name }} found."
              exit 0
            fi
            echo "Release ${{ github.ref_name }} not found yet (attempt $i/10), retrying in 5s..."
            sleep 5
          done
          echo "::error::Release ${{ github.ref_name }} did not appear within ~50s of the tag push."
          exit 1

      - name: Attach binary to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} example/server/smeldr-server-linux-amd64
