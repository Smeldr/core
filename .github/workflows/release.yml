name: Release binaries

on:
  push:
    tags: ['v*']

jobs:
  build-and-attach:
    name: Build example/server and attach to the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build example/server (five targets, static)
        working-directory: example/server
        env:
          GOWORK: 'off'
          CGO_ENABLED: '0'
        run: |
          set -eu
          # The binary is built at the tag, so core in it is that release: stamp it,
          # since the local replace makes the build info say "(devel)" (T1000).
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-X smeldr.dev/core.releaseVersion=${{ github.ref_name }}" -o "dist/smeldr-server-$os-$arch$ext" .
          done

      - name: Write SHA256SUMS
        working-directory: example/server/dist
        run: sha256sum smeldr-server-* > SHA256SUMS

      # Release prep creates the release as a draft (T1172), so it is not
      # releases/latest until every asset below is attached and checked.
      - name: Confirm the release exists before attaching to it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 20); do
            if state=$(gh release view ${{ github.ref_name }} --json isDraft --jq .isDraft 2>/dev/null); then
              echo "Release ${{ github.ref_name }} found on attempt $i/20 (draft: $state)."
              exit 0
            fi
            echo "Release ${{ github.ref_name }} not found yet (attempt $i/20), retrying in 5s..."
            sleep 5
          done
          echo "::error::Release ${{ github.ref_name }} did not appear within ~100s of the tag push."
          exit 1

      - name: Attach binaries and SHA256SUMS to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} example/server/dist/*

      - name: Verify every asset is attached and matches SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          want="SHA256SUMS smeldr-server-darwin-amd64 smeldr-server-darwin-arm64 smeldr-server-linux-amd64 smeldr-server-linux-arm64 smeldr-server-windows-amd64.exe"
          got=$(gh release view ${{ github.ref_name }} --json assets --jq '[.assets[] | select(.size > 0) | .name] | sort | join(" ")')
          if [ "$got" != "$want" ]; then
            echo "::error::Release assets are \"$got\", want \"$want\". The release stays a draft."
            exit 1
          fi
          dir=$(mktemp -d)
          gh release download ${{ github.ref_name }} --dir "$dir"
          (cd "$dir" && sha256sum -c SHA256SUMS)

      # --latest is right while every release is on the newest line. A patch
      # to an older line must not take latest: publish that one without it.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(gh release view ${{ github.ref_name }} --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit ${{ github.ref_name }} --draft=false --latest
            echo "Published ${{ github.ref_name }}."
          else
            echo "Release ${{ github.ref_name }} was already published; nothing to do."
          fi
